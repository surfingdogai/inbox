name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: check · typecheck · client build · test (node + workers) · kit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @surfingdog/inbox types
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm --filter @surfingdog/inbox build:client
      - run: pnpm test:node
      - run: pnpm test:workers
      - run: pnpm kit
