name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: check · typecheck · client build · test (node + workers) · kit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @surfingdog/inbox types
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm --filter @surfingdog/inbox build:client
      - run: pnpm --filter @surfingdog/sdk build
      - run: pnpm test:node
      - run: pnpm test:workers
      - run: pnpm kit

  wordpress:
    name: wordpress plugin · lint · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The runner's own PHP: every file parses, and the plugin's tests (WordPress stood in for)
      # hold its lines to packages/spec/vectors/discovery.json.
      - run: php --version
      - run: for f in integrations/wordpress/surfingdog-inbox/*.php integrations/wordpress/surfingdog-inbox/tests/*.php; do php -l "$f"; done
      - run: php integrations/wordpress/surfingdog-inbox/tests/run.php

  site:
    name: site · typecheck · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @surfingdog/site typecheck
      - run: pnpm --filter @surfingdog/site build
