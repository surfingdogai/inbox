apply plugin: 'com.android.application'

android {
    namespace = "ai.surfingdog.inbox"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ai.surfingdog.inbox"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // CI sets these (ANDROID_VERSION_CODE, ANDROID_VERSION_NAME); local builds are 1 / 0.1.0. A release
        // takes them from its tag, android-v1.2.3 → 1.2.3 and 10203 (major × 10000 + minor × 100 + patch),
        // so a release is always above every test build (numbered by their run) and never goes down.
        versionCode((System.getenv("ANDROID_VERSION_CODE") ?: "1") as int)
        versionName(System.getenv("ANDROID_VERSION_NAME") ?: "0.1.0")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // The release key: one PKCS12 keystore that signs every public build for good (a phone installs an
    // update only from the same key). Only the workflow android-release holds it, from the secrets of
    // the GitHub environment android-release, and hands it over in ANDROID_RELEASE_KEYSTORE (the file),
    // ANDROID_RELEASE_KEYSTORE_PASSWORD and ANDROID_RELEASE_KEY_ALIAS. Without them a release build is
    // unsigned, and nothing can install it.
    def releaseKeystore = System.getenv("ANDROID_RELEASE_KEYSTORE")
    // The test key: AGP's own debug key, unless ANDROID_TEST_KEYSTORE names a debug keystore (password
    // android, alias androiddebugkey). Workflow android hands over the repository's DEBUG_KEYSTORE_BASE64
    // that way, by path, since where AGP keeps its debug key depends on the machine.
    def testKeystore = System.getenv("ANDROID_TEST_KEYSTORE")
    signingConfigs {
        debug {
            if (testKeystore) {
                storeFile = file(testKeystore)
                storePassword = "android"
                keyAlias = "androiddebugkey"
                keyPassword = "android"
            }
        }
        release {
            if (releaseKeystore) {
                storeFile = file(releaseKeystore)
                storeType = "pkcs12"
                storePassword = System.getenv("ANDROID_RELEASE_KEYSTORE_PASSWORD")
                keyAlias = System.getenv("ANDROID_RELEASE_KEY_ALIAS") ?: "surfingdog-inbox"
                // A PKCS12 keystore has one password, for the store and its key.
                keyPassword = System.getenv("ANDROID_RELEASE_KEYSTORE_PASSWORD")
            }
        }
    }
    buildTypes {
        // The public app (apps/mobile/README.md → Releases): shrunk, not debuggable, signed with the
        // release key. Built only by the workflow android-release, from a tag on main.
        release {
            debuggable false
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = (releaseKeystore ? signingConfigs.release : null)
        }
        // The test build a person installs by hand (ADR-028): built as the release is, so not debuggable
        // (no `run-as`, no debugger reading tokens from memory) and shrunk, but signed with the test key
        // (in CI the repository's DEBUG_KEYSTORE_BASE64, in ANDROID_TEST_KEYSTORE, so each test build
        // installs over the last). The test key is not the release key, so a test build can never
        // install over the public app, nor the public app over a test build: remove one before
        // installing the other. The debug build is for the emulator's tests only.
        internal {
            initWith release
            debuggable false
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // The phone's own plugin (ADR-028): BiometricPrompt, and Firebase Cloud Messaging for notifications.
    implementation "androidx.biometric:biometric:1.1.0"
    implementation "com.google.firebase:firebase-messaging:25.1.3"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test:runner:1.7.0"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
